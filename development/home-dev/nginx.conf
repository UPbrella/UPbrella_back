server {
  listen 80;
  server_name _;
  # Preserve HTTPS when an external TLS proxy forwards requests over HTTP.
  absolute_redirect off;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 6m;
  add_header Permissions-Policy "camera=(self), microphone=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location = / { return 302 /upbrella-dev/; }
  location = /upbrella-dev { return 301 /upbrella-dev/; }
  location ^~ /upbrella-dev/api/ {
    set $api_backend http://api:8080;
    rewrite ^/upbrella-dev/api/(.*)$ /$1 break;
    proxy_pass $api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
  location /upbrella-dev/ {
    try_files $uri $uri/ /upbrella-dev/index.html;
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
