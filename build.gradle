buildscript {
    ext {
        queryDslVersion = "5.0.0"
    }
}

plugins {
    id 'org.springframework.boot' version '2.7.13'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'jacoco'
    // Kotlin
    id 'org.jetbrains.kotlin.jvm' version '1.9.21'              // Kotlin 플러그인 추가
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.21'    // Kotlin Spring 플러그인 추가
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.21'       // Kotlin JPA 플러그인 추가
    id 'org.jetbrains.kotlin.kapt' version '1.9.21'             // Kotlin Annotation Processing 플러그인
}

group = 'upbrella-server-dev'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    asciidoctorExt
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("./build/generated-snippets"))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    //RestDocs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    // aws service
    implementation 'com.amazonaws:aws-java-sdk-core:1.12.429'
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.429'
    implementation 'software.amazon.awssdk:s3:2.16.83'

    // validation 추가
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // LocalTime 위한 의존성 추가
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Fixture 생성 라이브러리
    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.10")

    // Test용 H2 In-memory DB
    testImplementation group: 'com.h2database', name: 'h2', version: '1.4.200'

    // HOTP
    implementation 'com.github.bastiaanjansen:otp-java:2.0.3'

    // Kotlin 의존성 추가
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    testImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"

    // QueryDSL Kotlin 설정 변경
    kapt "com.querydsl:querydsl-apt:${queryDslVersion}:jpa"
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}"

    // kotlin fixture monkey
    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter-kotlin:1.1.10")

    // datadog
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-datadog'

    // JWT for Apple Sign In
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    // Image Processing
    implementation 'net.coobird:thumbnailator:0.4.20'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'
}

// Kotlin 컴파일 옵션 설정
compileKotlin {
    kotlinOptions {
        freeCompilerArgs = ['-Xjsr305=strict']
        jvmTarget = '17'
    }
}

compileTestKotlin {
    kotlinOptions {
        freeCompilerArgs = ['-Xjsr305=strict']
        jvmTarget = '17'
    }
}

ext {
    snippetsDir = file('./build/generated-snippets')
}

test {
    outputs.dir snippetsDir
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
    jacoco {
        excludes = ['sun/security/**']
    }
}

asciidoctor {
    inputs.dir snippetsDir
    configurations 'asciidoctorExt'

    sources {
        include("**/index.adoc")
    }
    baseDirFollowsSourceFile()

    dependsOn test
}

bootJar {
    dependsOn asciidoctor
    from("${asciidoctor.outputDir}") {
        into 'static/docs'
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    reports {
        // 원하는 리포트를 켜고 끌 수 있습니다.
        html.required.set(true)
        xml.required.set(false)
        csv.required.set(false)
    }

    def Qdomains = []
    for (qPattern in "**/QA".."**/QZ") {
        Qdomains.add(qPattern + "*")
    }

    afterEvaluate {

        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: [] + Qdomains)
        }))
    }


    finalizedBy 'jacocoTestCoverageVerification'
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.0
                // 최소 커버리지 비율 설정 -> 임시로 0% 설정
            }

            excludes = ["*.Q*"]

        }
    }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
}

kapt {
    correctErrorTypes = true
    generateStubs = true
}
