spring:
  config:
    # 비밀값은 실행 환경변수로 넣는다 (예: KAKAO_CLIENT_SECRET_PROD). 파일이 있으면 그 값도 읽는다.
    import: "optional:classpath:application.properties"
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    session:
      cookie:
        same-site: none

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
