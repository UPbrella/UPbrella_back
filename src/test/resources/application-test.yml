spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # H2 테스트는 엔티티로 스키마를 만든다(ddl-auto). 마이그레이션은 FlywayMigrationTest가 MySQL에서 확인한다
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE

APPLE_CLIENT_ID_DEV: test-client-id
APPLE_TEAM_ID_DEV: test-team-id
APPLE_KEY_ID_DEV: test-key-id
APPLE_P8_KEY_PATH_DEV: keys/AuthKey_TEST.p8
APPLE_REDIRECT_URI_DEV: https://test.redirect.uri
APPLE_LOGIN_URI_DEV: https://test.login.uri
