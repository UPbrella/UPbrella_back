spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE

APPLE_CLIENT_ID_DEV: test-client-id
APPLE_TEAM_ID_DEV: test-team-id
APPLE_KEY_ID_DEV: test-key-id
APPLE_P8_KEY_PATH_DEV: keys/AuthKey_TEST.p8
APPLE_REDIRECT_URI_DEV: https://test.redirect.uri
APPLE_LOGIN_URI_DEV: https://test.login.uri

# Non-secret values for isolated tests; no external integrations are used.
AWS_ACCESS_KEY: test-disabled
AWS_SECRET_ACCESS_KEY: test-disabled
AWS_REGION: ap-northeast-2
AWS_S3_BUCKET: test-disabled
KAKAO_CLIENT_ID_DEV: test-disabled
KAKAO_CLIENT_SECRET_DEV: test-disabled
KAKAO_REDIRECT_URI_DEV: http://localhost/auth
KAKAO_LOGIN_URI_DEV: http://localhost/login
ALGORITHM: AES/CBC/PKCS5Padding
SECRET_KEY: "1234567890123456"
SLACK_WEB_HOOK_URL: http://127.0.0.1:9/disabled
upbrella:
  slack-enabled: false
