# 워크플로우 이름
name: mac dev deploy

on:
  workflow_dispatch:
  push:
    branches:
      - chore/mac-deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. application.properties 파일 생성
      - name: Create application.properties
        run: echo "${{ secrets.APPLICATION_PROPERTIES_MAC_DEV }}" > src/main/resources/application.properties

      # 4. Apple p8 키 파일 생성
      - name: Create Apple p8 key file
        run: |
          mkdir -p src/main/resources/keys
          printf "%s" "${{ secrets.APPLE_P8_KEY }}" > src/main/resources/keys/AuthKey_HM7R7S4DYW.p8

      # 4. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: birdiehyun/upbrella-dev:latest

      # 6. Mac mini에 접속하여 Docker Hub에서 pull 후 배포
      - name: Deploy to Mac mini
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MAC_HOST }}
          username: ${{ secrets.MAC_USERNAME }}
          password: ${{ secrets.MAC_PASSWORD }}
          port: 22
          script: |
            set -e

            # 비대화형 SSH에서 Homebrew PATH 로드
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

            IMAGE_NAME="birdiehyun/upbrella-dev:latest"
            CONTAINER_NAME="upbrella-dev"
            PORT="9000"
            APP_PORT="8080"

            echo "### 1. 최신 Docker 이미지 pull"
            docker pull ${IMAGE_NAME}

            echo "### 2. 기존 컨테이너 중지 및 삭제"
            if [ $(docker ps -a -q -f name=^/${CONTAINER_NAME}$) ]; then
              echo "기존 컨테이너(${CONTAINER_NAME})를 중지하고 삭제합니다."
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            else
              echo "실행 중인 컨테이너가 없습니다."
            fi

            echo "### 3. 새 컨테이너 실행"
            docker run -d \
              --name ${CONTAINER_NAME} \
              -p ${PORT}:${APP_PORT} \
              --restart unless-stopped \
              ${IMAGE_NAME}

            echo "### 4. 사용하지 않는 Docker 이미지 정리"
            docker image prune -af

            echo "배포 성공!!"
