# 워크플로우 이름
name: mac dev deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. application.properties 파일에 값 주입
      - name: Inject values into application.properties
        working-directory: omo-api
        run: |
          echo "" >> src/main/resources/application.properties
          echo "# Injected from GitHub Secrets" >> src/main/resources/application.properties
          echo "${{ secrets.APPLICATION_PROPERTIES_DEV }}" >> src/main/resources/application.properties

      # 4. omo-api: Gradle 빌드 (GitHub Actions runner에서 실행)
      - name: Build omo-api with Gradle
        working-directory: omo-api
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 5. AWS credentials 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. AWS ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: 733655682937

      # 7. omo-api: Docker 이미지 빌드 및 ECR에 푸시
      - name: Build and push omo-api Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: omo-api
          file: ./omo-api/Dockerfile
          push: true
          tags: 733655682937.dkr.ecr.ap-northeast-2.amazonaws.com/omo-server:omo-prod-latest

      # 8. Mac mini에 접속하여 ECR에서 pull 후 배포
      - name: Deploy to Mac mini
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MAC_HOST }}
          username: ${{ secrets.MAC_USERNAME }}
          password: ${{ secrets.MAC_PASSWORD }}
          port: 22
          script: |
            set -e

            # 비대화형 SSH에서 Homebrew PATH 로드
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

            # GitHub Secrets의 AWS 자격증명 사용 (Mac mini 로컬 설정 불필요)
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_KEY }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

            ECR_REGISTRY="733655682937.dkr.ecr.ap-northeast-2.amazonaws.com"
            ECR_REPOSITORY="omo-server"
            IMAGE_TAG="omo-prod-latest"
            IMAGE_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            CONTAINER_NAME="omo-api-prod"
            PORT="9000"
            APP_PORT="8080"

            echo "### 1. AWS ECR 로그인"
            mkdir -p ~/.docker
            echo '{"credsStore":""}' > ~/.docker/config.json
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            echo "### 2. 최신 Docker 이미지 pull"
            docker pull ${IMAGE_NAME}

            echo "### 3. 기존 컨테이너 중지 및 삭제"
            if [ $(docker ps -a -q -f name=^/${CONTAINER_NAME}$) ]; then
              echo "기존 컨테이너(${CONTAINER_NAME})를 중지하고 삭제합니다."
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            else
              echo "실행 중인 컨테이너가 없습니다."
            fi

            echo "### 4. 새 컨테이너 실행"
            docker run -d \
              --name ${CONTAINER_NAME} \
              -p ${PORT}:${APP_PORT} \
              --restart unless-stopped \
              ${IMAGE_NAME}

            echo "### 5. 사용하지 않는 Docker 이미지 정리"
            docker image prune -af

            echo "배포 성공!!"
